spring:
  application:
    name: courses-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ielts_courses}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-please-use-32-bytes-minimum}
    ttl-seconds: 604800
  play:
    credential-ttl-seconds: 300
    preview-ttl-seconds: 300
    # 水印占位符：{nickname} 昵称 {phone} 脱敏手机号 {phoneTail} 手机尾号 {uid} 用户ID {time} 时间 {lesson} 课时名
    watermark-template: '{nickname} · {phoneTail} · UID{uid} · {time}'
  wechat:
    open:
      app-id: ${WX_OPEN_APP_ID:}
      app-secret: ${WX_OPEN_APP_SECRET:}
    mp:
      app-id: ${WX_MP_APP_ID:}
      app-secret: ${WX_MP_APP_SECRET:}
    pay:
      mch-id: ${WX_MCH_ID:}
      api-v3-key: ${WX_API_V3_KEY:}
      notify-url: ${WX_PAY_NOTIFY_URL:}
  tencent:
    vod:
      app-id: ${VOD_APP_ID:0}
      sub-app-id: ${VOD_SUB_APP_ID:0}
      secret-id: ${VOD_SECRET_ID:}
      secret-key: ${VOD_SECRET_KEY:}
      play-key: ${VOD_PLAY_KEY:}
      # 自适应码流模板 ID（预置 Adaptive-HLS 模板为 10），播放凭证按该模板转码状态动态签发
      adaptive-definition: ${VOD_ADAPTIVE_DEFINITION:10}
      # 客户端上传后自动执行的任务流名称（在 VOD 控制台创建含自适应转码的任务流后配置；为空则上传后不自动转码）
      upload-procedure: ${VOD_UPLOAD_PROCEDURE:}
    cos:
      bucket: ${COS_BUCKET:}
      region: ${COS_REGION:ap-guangzhou}
      preview-url: ${COS_PREVIEW_URL:}
      # 未单独配置 COS 密钥时，复用 VOD 的腾讯云密钥（同一账号）
      secret-id: ${COS_SECRET_ID:${VOD_SECRET_ID:}}
      secret-key: ${COS_SECRET_KEY:${VOD_SECRET_KEY:}}
